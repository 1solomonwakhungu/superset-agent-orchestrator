[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superset-agent-orchestrator"
version = "0.1.0"
description = "Local-first durable orchestration primitives for Superset agents"
requires-python = ">=3.11"

[project.scripts]
workspace-safety = "superset_agent_orchestrator.workspace_safety:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
